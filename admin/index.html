<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>삼겹줄 관리자</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<main id="app"></main>

<script src="../couples.js"></script>
<script src="../firebase-config.js"></script>
<script src="../store.js"></script>
<script>
var app = document.getElementById("app");
var editingId = null;

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function fmtTime(ts) {
  try { return new Date(ts).toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" }); } catch (e) { return ""; }
}

function render() {
  var state = Store.getState();
  var presentCount = state.presentIds.length;

  var atts = window.COUPLES.map(function (c) {
    var on = state.presentIds.indexOf(c.id) !== -1;
    return '<label class="att-row"><input type="checkbox" data-att="' + c.id + '"' + (on ? " checked" : "") + '>' +
      '<span><b>' + esc(coupleName(c)) + '</b> <span class="couple-meta">· ' + esc(fmtDuration(c)) + '</span><br>' +
      '<span class="couple-meta">' + esc(fmtHowMet(c)) + '</span></span></label>';
  }).join("");

  var qs = state.questions.slice().sort(function (a, b) { return a.createdAt - b.createdAt; });
  var qlist;
  if (qs.length === 0) {
    qlist = '<div class="empty">아직 접수된 질문이 없습니다.</div>';
  } else {
    qlist = qs.map(function (q) {
      var t = findCouple(q.targetId);
      var head = '<div class="couple-name">받는 부부: ' + esc(t ? coupleName(t) : "?") + '</div>' +
                 '<div class="couple-meta">' + fmtTime(q.createdAt) + ' · 익명</div>';
      if (editingId === q.id) {
        return '<div class="card q-row">' + head +
          '<textarea id="edit-text">' + esc(q.text) + '</textarea>' +
          '<button data-save="' + q.id + '">저장</button>' +
          '<button data-cancel="1">취소</button></div>';
      }
      return '<div class="card q-row">' + head +
        '<p>“' + esc(q.text) + '”</p>' +
        '<button data-edit="' + q.id + '">수정</button>' +
        '<button class="danger" data-del="' + q.id + '">삭제</button></div>';
    }).join("");
  }

  app.innerHTML =
    '<h1>관리자 — 삼겹줄 아이스브레이커</h1>' +
    '<p class="sub">모드: <b>' + (Store.mode() === "local" ? "로컬" : "실시간 동기화") + '</b>' +
    (Store.mode() === "local" ? ' — 이 기기에만 저장됩니다. 휴대폰 간 실시간 동기화는 firebase-config.js 설정을 참고하세요.' : ' — 모든 기기가 실시간으로 동기화됩니다.') + '</p>' +
    '<h2>출석 확인 — <span class="count">' + presentCount + ' / ' + window.COUPLES.length + ' 부부 참석</span></h2>' +
    atts +
    '<h2>질문 목록 (' + qs.length + '개)</h2>' + qlist;

  app.querySelectorAll("[data-att]").forEach(function (box) {
    box.addEventListener("change", function () {
      Store.setAttendance(parseInt(box.getAttribute("data-att"), 10), box.checked);
    });
  });
  app.querySelectorAll("[data-edit]").forEach(function (b) {
    b.addEventListener("click", function () { editingId = b.getAttribute("data-edit"); render(); });
  });
  app.querySelectorAll("[data-del]").forEach(function (b) {
    b.addEventListener("click", function () {
      if (confirm("이 질문을 삭제할까요? 삭제하면 질문한 부부가 다시 질문할 수 있습니다.")) {
        Store.deleteQuestion(b.getAttribute("data-del"));
      }
    });
  });
  app.querySelectorAll("[data-save]").forEach(function (b) {
    b.addEventListener("click", function () {
      Store.updateQuestion(b.getAttribute("data-save"), document.getElementById("edit-text").value);
      editingId = null;
    });
  });
  app.querySelectorAll("[data-cancel]").forEach(function (b) {
    b.addEventListener("click", function () { editingId = null; render(); });
  });
}

Store.subscribe(render);
Store.init(render);
</script>
</body>
</html>
