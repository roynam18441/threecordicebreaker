<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>삼겹줄 아이스브레이커</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app"></main>

<script src="couples.js"></script>
<script src="firebase-config.js"></script>
<script src="store.js"></script>
<script>
// 질문하는 사람은 익명입니다 — 이름이나 부부를 선택하지 않습니다.
// 아래 토큰은 이 기기에서 만든 무작위 값으로, "부부당 질문 하나"를 지키는
// 용도로만 쓰이며 어디에도 표시되지 않습니다.
var deviceKey = null;
try {
  deviceKey = localStorage.getItem("threecord_device_key");
  if (!deviceKey) {
    deviceKey = "dev" + Date.now() + Math.floor(Math.random() * 1000000);
    localStorage.setItem("threecord_device_key", deviceKey);
  }
} catch (e) { deviceKey = "dev-ephemeral"; }

var app = document.getElementById("app");
var targetId = null;    // 질문을 받을 부부
var view = "main";      // "main" (질문 작성) | "done" (제출 완료) | "home" (제출 후 참석자 확인)

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function render() {
  var state = Store.getState();
  var present = window.COUPLES.filter(function (c) { return state.presentIds.indexOf(c.id) !== -1; });

  if (present.length === 0) {
    app.innerHTML = '<div class="waiting">아직 체크인이 시작되지 않았습니다.<br>호스트가 출석을 확인할 때까지 잠시만 기다려 주세요.</div>';
    return;
  }

  var mine = state.questions.find(function (q) { return q.askerId === deviceKey; });

  if (mine) {
    var t = findCouple(mine.targetId);
    if (view === "home") {
      // 제출 후 홈 화면 — 참석한 부부를 다시 확인할 수 있는 읽기 전용 목록
      var homeList = present.map(function (c) {
        return '<div class="card">' +
          '<div class="couple-name">' + esc(coupleName(c)) + '</div>' +
          '<div class="couple-meta">' + esc(fmtDuration(c)) + '</div>' +
          '<div class="how-met">' + esc(fmtHowMet(c)) + '</div></div>';
      }).join("");
      app.innerHTML =
        '<h1>삼겹줄 아이스브레이커 💛</h1>' +
        '<div class="card"><b>익명 질문을 이미 보냈습니다.</b><br>' +
        '<span class="couple-meta">받는 부부: ' + esc(t ? coupleName(t) : "") + '</span>' +
        '<div class="how-met">“' + esc(mine.text) + '”</div></div>' +
        '<button class="primary" id="toDone" style="margin-top:0">보낸 질문 확인하기</button>' +
        '<h2>참석한 부부</h2>' + homeList;
      document.getElementById("toDone").addEventListener("click", function () { view = "done"; render(); });
      return;
    }
    app.innerHTML =
      '<div class="done"><h1>감사합니다! 🙏</h1>' +
      '<p class="sub">익명 질문이 전달되었습니다.</p>' +
      '<p>받는 부부: <b>' + esc(t ? coupleName(t) : "") + '</b></p>' +
      '<p class="q">“' + esc(mine.text) + '”</p>' +
      '<p class="sub">부부당 하나의 질문만 보낼 수 있어요. 참여해 주셔서 감사합니다.</p>' +
      '<button class="primary" id="goHome">홈으로 돌아가기 — 참석한 부부 확인하기</button></div>';
    document.getElementById("goHome").addEventListener("click", function () { view = "home"; render(); });
    return;
  }
  view = "main";

  if (targetId && state.presentIds.indexOf(targetId) === -1) targetId = null;

  var list = present.map(function (c) {
    var isTarget = targetId === c.id;
    return '<button type="button" class="card pickable' + (isTarget ? " selected" : "") + '" data-target="' + c.id + '">' +
      '<div class="couple-name">' + esc(coupleName(c)) + '</div>' +
      '<div class="couple-meta">' + esc(fmtDuration(c)) + '</div>' +
      '<div class="how-met">' + esc(fmtHowMet(c)) + '</div></button>';
  }).join("");

  app.innerHTML =
    '<h1>삼겹줄 아이스브레이커 💛</h1>' +
    '<p class="sub">궁금한 부부를 선택하고, 그 부부에 대해 더 알아갈 수 있는 질문을 익명으로 남겨 보세요. 질문하는 분이 누구인지는 공개되지 않으며, 부부당 하나의 질문만 보낼 수 있습니다.</p>' +
    '<h2>참석한 부부 — 질문할 부부를 눌러 주세요</h2>' + list +
    '<label class="field" for="q">익명 질문</label>' +
    '<textarea id="q" placeholder="예: 결혼하고 나서 가장 많이 맞춰가고 있는 부분은 무엇인가요?"></textarea>' +
    '<div class="error" id="err"></div>' +
    '<button class="primary" id="send">익명으로 질문 보내기</button>';

  app.querySelectorAll("[data-target]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      targetId = parseInt(btn.getAttribute("data-target"), 10);
      render();
      var q = document.getElementById("q"); if (q) q.focus();
    });
  });
  document.getElementById("send").addEventListener("click", function () {
    var err = document.getElementById("err");
    if (!targetId) { err.textContent = "먼저 위에서 질문할 부부를 선택해 주세요."; return; }
    var text = document.getElementById("q").value;
    var res = Store.submitQuestion(deviceKey, targetId, text);
    if (!res.ok) { err.textContent = res.error; return; }
    render();
  });
}

Store.subscribe(render);
Store.init(render);
</script>
</body>
</html>
