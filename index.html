<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>삼겹줄 Icebreaker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app"></main>

<script src="couples.js"></script>
<script src="firebase-config.js"></script>
<script src="store.js"></script>
<script>
var app = document.getElementById("app");
var myId = null;        // the asking couple ("We are...")
var targetId = null;    // the couple being asked
try { myId = parseInt(localStorage.getItem("threecord_my_id") || "", 10) || null; } catch (e) {}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function render() {
  var state = Store.getState();
  var present = window.COUPLES.filter(function (c) { return state.presentIds.indexOf(c.id) !== -1; });

  if (present.length === 0) {
    app.innerHTML = '<div class="waiting">Check-in hasn\'t opened yet — please wait for the host.<br><br>아직 체크인이 시작되지 않았습니다. 잠시만 기다려 주세요.</div>';
    return;
  }

  // If my couple is no longer present (admin unchecked), reset identity.
  if (myId && state.presentIds.indexOf(myId) === -1) { myId = null; targetId = null; }

  var mine = myId ? state.questions.find(function (q) { return q.askerId === myId; }) : null;

  if (mine) {
    var t = findCouple(mine.targetId);
    app.innerHTML =
      '<div class="done"><h1>Thank you! 🙏</h1>' +
      '<p class="sub">Your anonymous question has been sent.</p>' +
      '<p>To: <b>' + esc(t ? coupleName(t) : "") + '</b></p>' +
      '<p class="q">“' + esc(mine.text) + '”</p>' +
      '<p class="sub">Each couple asks one question — you\'re all set.</p></div>';
    return;
  }

  var options = present.map(function (c) {
    return '<option value="' + c.id + '"' + (myId === c.id ? " selected" : "") + '>' + esc(coupleName(c)) + '</option>';
  }).join("");

  var list = present.map(function (c) {
    var isTarget = targetId === c.id;
    var dis = myId === c.id;
    return '<button type="button" class="card pickable' + (isTarget ? " selected" : "") + '" data-target="' + c.id + '"' + (dis ? " disabled style=\"opacity:.45\"" : "") + '>' +
      '<div class="couple-name">' + esc(coupleName(c)) + '</div>' +
      '<div class="couple-meta">결혼 ' + esc(c.duration) + (dis ? " · 우리 부부" : "") + '</div>' +
      '<div class="how-met">💛 ' + esc(c.howMet) + '</div></button>';
  }).join("");

  app.innerHTML =
    '<h1>삼겹줄 Icebreaker 💛</h1>' +
    '<p class="sub">Pick your couple, choose another couple, and ask them one anonymous question.</p>' +
    '<label class="field" for="me">We are… (우리 부부)</label>' +
    '<select id="me"><option value="">— select your couple —</option>' + options + '</select>' +
    '<h2>Who\'s here — tap a couple to ask them</h2>' + list +
    '<label class="field" for="q">Your anonymous question</label>' +
    '<textarea id="q" placeholder="e.g. 결혼하고 나서 가장 많이 맞춰가고 있는 부분은 무엇인가요?"></textarea>' +
    '<div class="error" id="err"></div>' +
    '<button class="primary" id="send">Send question anonymously</button>';

  document.getElementById("me").addEventListener("change", function (e) {
    myId = parseInt(e.target.value, 10) || null;
    if (targetId === myId) targetId = null;
    try { localStorage.setItem("threecord_my_id", myId || ""); } catch (err) {}
    render();
  });
  app.querySelectorAll("[data-target]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      targetId = parseInt(btn.getAttribute("data-target"), 10);
      render();
      var q = document.getElementById("q"); if (q) q.focus();
    });
  });
  document.getElementById("send").addEventListener("click", function () {
    var err = document.getElementById("err");
    if (!myId) { err.textContent = "First pick your own couple under “We are…”."; return; }
    if (!targetId) { err.textContent = "Tap a couple above to ask them a question."; return; }
    var text = document.getElementById("q").value;
    var res = Store.submitQuestion(myId, targetId, text);
    if (!res.ok) { err.textContent = res.error; return; }
    render();
  });
}

Store.subscribe(render);
Store.init(render);
</script>
</body>
</html>
